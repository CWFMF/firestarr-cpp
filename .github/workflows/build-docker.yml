name: build-docker

on:
  push:
    paths-ignore:
      - '.github/workflows/cmake-test.yml'
      - '.github/workflows/docker-cleanup.yml'

  workflow_dispatch:

env:
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  # split this way so hopefully the cache is there between normal and minimal
  build-docker-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # no point in more than base image supports
        # ignore 32-bit - 386, arm/v5, arm/v7
        # arm64 == arm64/v8
        platform: [amd64, arm64, ppc64le, riscv64, s390x]
        # platform: [amd64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - name: Prepare environment
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//}" >> $GITHUB_ENV
          registry=ghcr.io/${GITHUB_REPOSITORY@L}
          package=${{ case( startsWith(github.ref, 'refs/tags/v') || contains('["main", "dev", "unstable"]', github.ref_name), 'firestarr', 'cache' ) }}
          echo "REGISTRY_CACHE=${registry}/cache:${platform//\//}" >> $GITHUB_ENV
          echo "PACKAGE=${registry}/${package}" >> $GITHUB_ENV
          echo "TARGET=firestarr" >> $GITHUB_ENV

      - name: Find variables
        run: |
          echo "CONTAINER_REGISTRY=${PACKAGE%%\/*}" >> $GITHUB_ENV
          echo "FOUND_REGISTRY=${PACKAGE%\/*}" >> $GITHUB_ENV
          echo "FOUND_PACKAGE=${PACKAGE##*\/}" >> $GITHUB_ENV

      - name: Login to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: ${{ env.TARGET }} - Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.PACKAGE }}

      - name: ${{ env.TARGET }} - Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile
          target: ${{ env.TARGET }}
          platforms: linux/${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.PACKAGE }}
          push: ${{ github.event_name != 'pull_request' }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=registry,ref=${{ env.REGISTRY_CACHE }}
          cache-to: |
            type=registry,mode=max,ref=${{ env.REGISTRY_CACHE }}

      - name: ${{ env.TARGET }} - Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests-${{ env.TARGET }}
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests-${{ env.TARGET }}/${digest#sha256:}"

      - name: ${{ env.TARGET }} - Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.TARGET }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests-${{ env.TARGET }}/*
          if-no-files-found: error
          retention-days: 1

      - name: Change target image
        run: |
          echo "TARGET=firestarr-minimal" >> $GITHUB_ENV

      - name: ${{ env.TARGET }} - Docker meta
        id: meta-minimal
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.PACKAGE }}

      - name: ${{ env.TARGET }} - Build and push by digest
        id: build-minimal
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile
          target: ${{ env.TARGET }}
          platforms: linux/${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.PACKAGE }}
          labels: ${{ steps.meta-minimal.outputs.labels }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: |
            type=registry,ref=${{ env.REGISTRY_CACHE }}
          cache-to: |
            type=registry,mode=max,ref=${{ env.REGISTRY_CACHE }}

      - name: ${{ env.TARGET }} - Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests-${{ env.TARGET }}
          digest="${{ steps.build-minimal.outputs.digest }}"
          touch "${{ runner.temp }}/digests-${{ env.TARGET }}/${digest#sha256:}"

      - name: ${{ env.TARGET }} - Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.TARGET }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests-${{ env.TARGET }}/*
          if-no-files-found: error
          retention-days: 1

  merge-firestarr:
    needs: [build-docker-image]
    uses: ./.github/workflows/docker-merge-image.yml
    with:
      target: firestarr
      flavor: |
        latest=${{ case ( startsWith(github.ref, 'refs/tags/v'), 'auto', 'false' ) }}
        prefix=
        suffix=
      tags: |
        type=ref,event=pr
        type=ref,prefix=,suffix=,event=branch,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
        type=ref,prefix=,suffix=-latest,event=branch,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
        type=semver,pattern={{version}},prefix=,suffix=,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
        type=semver,pattern={{major}}.{{minor}},prefix=,suffix=,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

  merge-firestarr-minimal:
    needs: [build-docker-image]
    uses: ./.github/workflows/docker-merge-image.yml
    with:
      target: firestarr-minimal
      flavor: |
        latest=false
        prefix=
        suffix=-minimal
      tags: |
        type=ref,event=pr
        type=ref,prefix=,suffix=-minimal,event=branch,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
        type=ref,prefix=,suffix=-minimal-latest,event=branch,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
        type=semver,pattern={{version}},prefix=,suffix=-minimal,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
        type=semver,pattern={{major}}.{{minor}},prefix=,suffix=-minimal,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
        type=raw,value=minimal,prefix=,suffix=,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
        type=raw,value=minimal-latest,prefix=,suffix=,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
