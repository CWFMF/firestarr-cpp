name: build-docker

# NOTE:
#   This is a mess because the cmake process relies on having .git mounted,
#   and also captures the build time, so docker sees any push as modifying
#   things, and it makes a new image.
#   This caches the built image with the commit hash, and then adds tags to it if
#   another push is the same hash.

on:
  push:
    paths-ignore:
      - '.github/workflows/cmake-test.yml'
      - '.github/workflows/docker-cleanup.yml'

  workflow_dispatch:

# queue runs so that images get built & cache gets used instead of building in parallel
concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  queue: max

env:
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  # split this way so hopefully the cache is there between normal and minimal
  build-docker-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # no point in more than base image supports
        # ignore 32-bit - 386, arm/v5, arm/v7
        # arm64 == arm64/v8
        # platform: [amd64, arm64, ppc64le, riscv64, s390x]
        platform: [amd64]
    env:
      registry: 'ghcr.io'
      package-name: ${{ case( startsWith(github.ref, 'refs/tags/v') || contains('["main", "dev", "unstable"]', github.ref_name), 'firestarr', 'cache' ) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - name: Login to container registry
        id: login
        uses: docker/login-action@v4
        with:
          registry: ${{ env.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare environment
        shell: bash
        run: |
          PLATFORM=${{ matrix.platform }}
          REPO=${{ env.registry }}/${GITHUB_REPOSITORY@L}
          REF_NAME=${{ github.ref_name }}
          echo "PLATFORM_PAIR=${PLATFORM//\//}" >> $GITHUB_ENV
          echo "CACHE_REF=${REF_NAME//\//}" >> $GITHUB_ENV
          echo "PACKAGE=${REPO}/firestarr" >> $GITHUB_ENV
          echo "REGISTRY_CACHE=${REPO}/cache" >> $GITHUB_ENV

      # treat changing .env as if it were tagged even if that hasn't happened yet
      - name: Check tags
        id: check
        run: |
          . ./.env
          cached=${REGISTRY}:${{ github.sha }}
          cached_minimal=${cached}-minimal
          ENV_TAG=v${VERSION}
          VERSION_HASH=$(git log -n1 --pretty=%H -- .env)
          FULL_HASH=$(git rev-parse --verify HEAD)
          is_tagged=false
          if [[ "${VERSION_HASH}" == "${FULL_HASH}" ]]; then
            is_tagged=true
            echo "tagged-hash=${FULL_HASH}" >> $GITHUB_OUTPUT
            echo "tag=${VERSION}" >> $GITHUB_OUTPUT
          fi
          echo "CACHED=${cached}" >> $GITHUB_ENV
          echo "CACHED_MINIMAL=${cached_minimal}" >> $GITHUB_ENV
          echo "IS_TAGGED=${is_tagged}" >> $GITHUB_ENV

      # unsure how minimal could exist without other
      - name: Check existing
        id: check-missing
        run: |
          echo "env.CACHED: ${{ env.CACHED }}"
          echo "env.CACHED_MINIMAL: ${{ env.CACHED_MINIMAL }}"
          MISSING=$( \
            ( \
              ( \
                docker manifest inspect ${{ env.CACHED }} \
                && docker manifest inspect ${{ env.CACHED_MINIMAL }} \
              ) > /dev/null 2>&1 \
              && echo "false" \
            ) || echo "true")
          echo "MISSING: ${MISSING}"
          echo "MISSING=${MISSING}" >> $GITHUB_ENV
          echo "image-missing=${MISSING}" >> $GITHUB_OUTPUT

      - uses: ./.github/actions/docker-build-image
        id: build-firestarr
        with:
          target: firestarr
          registry: ${{ env.registry }}
          package-name: ${{ env.package-name }}
          platform: ${{ matrix.platform }}
          suffix:
          image-missing: ${{ 'true' == steps.check-missing.outputs.image-missing }}

      - uses: ./.github/actions/docker-build-image
        id: build-firestarr-minimal
        with:
          target: firestarr-minimal
          registry: ${{ env.registry }}
          package-name: ${{ env.package-name }}
          platform: ${{ matrix.platform }}
          suffix: -minimal
          image-missing: ${{ 'true' == steps.check-missing.outputs.image-missing }}

    outputs:
      package: ${{ steps.build-firestarr.outputs.package }}
      image-missing: ${{ 'true' == steps.check-missing.outputs.image-missing }}
      is-tagged: ${{ env.IS_TAGGED }}

  merge-firestarr:
    needs: [build-docker-image]
    uses: ./.github/workflows/docker-merge-image.yml
    with:
      target: firestarr
      package: ${{ needs.build-docker-image.outputs.package }}
      image-missing: ${{ 'true' == needs.build-docker-image.outputs.image-missing }}
      suffix:
      flavor: |
        latest=${{ case ( startsWith(github.ref, 'refs/tags/v'), 'auto', 'false' ) }}
        prefix=
        suffix=
      tags: |
        type=ref,event=pr
        type=ref,prefix=,suffix=,event=branch,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
        type=ref,prefix=,suffix=-latest,event=branch,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
        type=semver,pattern={{version}},prefix=,suffix=,enable=${{ needs.build-docker-image.outputs.is-tagged }}
        type=semver,pattern={{major}}.{{minor}},prefix=,suffix=,enable=${{ needs.build-docker-image.outputs.is-tagged }}
        type=raw,value=${{ github.sha }},prefix=,suffix=

  merge-firestarr-minimal:
    needs: [build-docker-image]
    uses: ./.github/workflows/docker-merge-image.yml
    with:
      target: firestarr-minimal
      package: ${{ needs.build-docker-image.outputs.package }}
      image-missing: ${{ 'true' == needs.build-docker-image.outputs.image-missing }}
      suffix: -minimal
      flavor: |
        latest=false
        prefix=
        suffix=-minimal
      tags: |
        type=ref,event=pr,prefix=,suffix=-minimal
        type=ref,prefix=,suffix=-minimal,event=branch,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
        type=ref,prefix=,suffix=-minimal-latest,event=branch,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
        type=semver,pattern={{version}},prefix=,suffix=-minimal,enable=${{ needs.build-docker-image.outputs.is-tagged }}
        type=semver,pattern={{major}}.{{minor}},prefix=,suffix=-minimal,enable=${{ needs.build-docker-image.outputs.is-tagged }}
        type=raw,value=minimal,prefix=,suffix=,enable=${{ needs.build-docker-image.outputs.is-tagged }}
        type=raw,value=minimal-latest,prefix=,suffix=,enable=${{ needs.build-docker-image.outputs.is-tagged }}
        type=raw,value=${{ github.sha }}-minimal,prefix=,suffix=
