name: build-docker

on:
  push:
    paths-ignore:
      - '.github/workflows/cmake-test.yml'
      - '.github/workflows/docker-cleanup.yml'

  workflow_dispatch:

env:
  CONTAINER_REGISTRY: ghcr.io
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  # split this way so hopefully the cache is there between normal and minimal
  build-docker-image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # no point in more than base image supports
        # ignore 32-bit - 386, arm/v5, arm/v7
        # arm64 == arm64/v8
        # platform: [amd64, arm64, ppc64le, riscv64, s390x]
        platform: [amd64]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - name: Prepare environment
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//}" >> $GITHUB_ENV
          registry=${{ env.CONTAINER_REGISTRY }}/${GITHUB_REPOSITORY@L}
          image=${{ case( startsWith(github.ref, 'refs/tags/v') || contains('["main", "dev", "unstable"]', github.ref_name), 'firestarr', 'cache' ) }}
          echo "TARGET_CACHE=${registry}/cache" >> $GITHUB_ENV
          echo "TARGET=${registry}/${image}" >> $GITHUB_ENV

      - name: Docker meta
        id: meta-normal
        uses: docker/metadata-action@v6
        with:
          images: |
            firestarr

      - name: Docker meta
        id: meta-minimal
        uses: docker/metadata-action@v6
        with:
          images: |
            firestarr-minimal

      - name: Login to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build-normal
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile
          platforms: linux/${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-normal.outputs.tags }}
          labels: ${{ steps.meta-normal.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.TARGET_CACHE }}
          cache-to: |
            type=registry,mode=max,ref=${{ env.TARGET_CACHE }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests-normal
          digest="${{ steps.build-normal.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-firestarr-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests-normal/*
          if-no-files-found: error
          retention-days: 1

      - name: Build and push by digest
        id: build-minimal
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .docker/Dockerfile
          platforms: linux/${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-minimal.outputs.tags }}
          labels: ${{ steps.meta-minimal.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.TARGET_CACHE }}
          cache-to: |
            type=registry,mode=max,ref=${{ env.TARGET_CACHE }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests-minimal
          digest="${{ steps.build-minimal.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-firestarr-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests-minimal/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    needs: [ build-docker-image ]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - name: Prepare environment
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//}" >> $GITHUB_ENV
          registry=${{ env.CONTAINER_REGISTRY }}/${GITHUB_REPOSITORY@L}
          image=${{ case( startsWith(github.ref, 'refs/tags/v') || contains('["main", "dev", "unstable"]', github.ref_name), 'firestarr', 'cache' ) }}
          echo "TARGET_CACHE=${registry}/cache" >> $GITHUB_ENV
          echo "TARGET=${registry}/${image}" >> $GITHUB_ENV

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests-normal
          pattern: digests-firestarr-*
          merge-multiple: true

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests-minimal
          pattern: digests-firestarr-minimal-*
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: metameta-normal
        uses: docker/metadata-action@v6
        with:
          images: |
            firestarr
          flavor: |
            latest=${{ case ( startsWith(github.ref, 'refs/tags/v'), 'auto', 'false' ) }}
            prefix=
            suffix=
          tags: |
            type=ref,event=pr
            type=ref,prefix=,suffix=,event=branch,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
            type=ref,prefix=,suffix=-latest,event=branch,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}},prefix=,suffix=,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},prefix=,suffix=,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests-normal
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.TARGET }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.TARGET }}:${{ steps.meta-normal.outputs.version }}

      - name: Docker meta
        id: meta-minimal
        uses: docker/metadata-action@v6
        with:
          images: |
            firestarr-minimal
          flavor: |
            latest=false
            prefix=
            suffix=-minimal
          tags: |
            type=ref,event=pr
            type=ref,prefix=,suffix=-minimal,event=branch,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
            type=ref,prefix=,suffix=-minimal-latest,event=branch,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}},prefix=,suffix=-minimal,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},prefix=,suffix=-minimal,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=minimal,prefix=,suffix=,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=minimal-latest,prefix=,suffix=,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests-minimal
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.TARGET }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.TARGET }}:${{ steps.meta-minimal.outputs.version }}
