name: docker-merge-image

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      package:
        required: true
        type: string
      # HACK: passing boolean to action doesn't work so use string and (== 'true') for both
      image-missing:
        required: true
        type: string
      suffix:
        required: false
        type: string
      flavor:
        required: true
        type: string
      tags:
        required: true
        type: string

env:
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  merge:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Show inputs
        shell: bash
        run: |
          echo "inputs.target=${{ inputs.target }}"
          echo "inputs.package=${{ inputs.package }}"
          echo "inputs.image-missing=${{ inputs.image-missing }}"
          echo "inputs.suffix=${{ inputs.suffix }}"
          echo "inputs.flavor=${{ inputs.flavor }}"
          echo "inputs.tags=${{ inputs.tags }}"

      - if: ${{ inputs.image-missing }}
        shell: bash
        run: |
          echo "inputs.image-missing"
          echo "${{ inputs.image-missing }}"

      - if: ${{ 'true' == inputs.image-missing }}
        shell: bash
        run: |
          echo "'true' == inputs.image-missing"
          echo "${{ inputs.image-missing }}"

      - if: ${{ 'false' == inputs.image-missing }}
        shell: bash
        run: |
          echo "'false' == inputs.image-missing"
          echo "${{ inputs.image-missing }}"

      - if: ${{ 'true' != inputs.image-missing }}
        shell: bash
        run: |
          echo "'true' != inputs.image-missing"
          echo "${{ inputs.image-missing }}"

      - if: ${{ 'false' != inputs.image-missing }}
        shell: bash
        run: |
          echo "'false' != inputs.image-missing"
          echo "${{ inputs.image-missing }}"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - name: Prepare environment
        run: |
          package=${{ inputs.package }}
          registry=${package%%\/*}
          repo=${registry}/${GITHUB_REPOSITORY@L}
          registry_cache=${repo}/cache
          cached=${registry_cache}:${{ github.sha }}${{ inputs.suffix }}
          echo "PACKAGE=${package}" >> $GITHUB_ENV
          echo "REGISTRY=${registry}" >> $GITHUB_ENV
          echo "REGISTRY_CACHE=${registry_cache}" >> $GITHUB_ENV
          echo "CACHED=${cached}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: ${{ inputs.target }} - Download digests
        if: ${{ 'true' == inputs.image-missing }}
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests-${{ inputs.target }}
          pattern: digests-${{ inputs.target }}-*
          merge-multiple: true

      - name: ${{ inputs.target }} - Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.package }}
          flavor: ${{ inputs.flavor }}
          tags: ${{ inputs.tags }}

      - name: ${{ inputs.target }} - Create manifest list and push
        if: ${{ 'true' == inputs.image-missing }}
        working-directory: ${{ runner.temp }}/digests-${{ inputs.target }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ inputs.package }}@sha256:%s ' *)

      - name: ${{ inputs.target }} - Inspect image
        if: ${{ 'true' == inputs.image-missing }}
        run: |
          docker buildx imagetools inspect ${{ inputs.package }}:${{ steps.meta.outputs.version }}

      - name: ${{ inputs.target }} - Push to cache with commit sha
        if: ${{ 'true' == inputs.image-missing }}
        run: |
          echo "TAGS are: ${{ steps.meta.outputs.tags }}"
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "TAG is ${TAG}"
          docker pull "${TAG}"
          docker tag "${TAG}" "${{ env.CACHED }}"
          docker push "${{ env.CACHED }}"

      # already exists, so want to add tags to existing image
      - name: ${{ inputs.target }} - Add tags to existing image - pull
        if: ${{ 'true' != inputs.image-missing }}
        run: |
          docker pull "${{ env.CACHED }}"
          echo "Pulled ${{ env.CACHED }}"
          echo "TAGS are: ${{ steps.meta.outputs.tags }}"
          TAGS="${{ steps.meta.outputs.tags }}"
          echo "TAGS after assign in bash are: ${TAGS}"
          for t in ${TAGS}
          do
            echo "Tag is: $t"
            git tag "${{ env.CACHED }}" "${t}"
            git push "${t}"
          done

      # already exists, so want to add tags to existing image
      - name: ${{ inputs.target }} - Add tags to existing image
        if: ${{ 'true' != inputs.image-missing }}
        run: |
          docker pull "${{ env.CACHED }}"
          echo "Pulled ${{ env.CACHED }}"
          echo "TAGS are: ${{ steps.meta.outputs.tags }}"
          TAGS="${{ steps.meta.outputs.tags }}"
          echo "TAGS after assign in bash are: ${TAGS}"
          for t in ${TAGS}
          do
            echo "Tag is: $t"
            git tag "${{ env.CACHED }}" "${t}"
            git push "${t}"
          done

      - name: Set outputs
        run: |
          echo "target=${{ inputs.target }}" >> $GITHUB_OUTPUT
          echo "package=${{ inputs.package }}" >> $GITHUB_OUTPUT
