name: docker-merge-image

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      package:
        required: true
        type: string
      image-missing:
        required: true
        type: boolean
      suffix:
        required: false
        type: string
      flavor:
        required: true
        type: string
      tags:
        required: true
        type: string

env:
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  merge:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: true

      - name: Prepare environment
        run: |
          package=${{ inputs.package }}
          registry=${package%%\/*}
          echo "CONTAINER_REGISTRY=${registry}" >> $GITHUB_ENV
          REPO=${registry}/${GITHUB_REPOSITORY@L}
          echo "REGISTRY_CACHE=${REPO}/cache" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: ${{ inputs.target }} - Download digests
        if: ${{ inputs.image-missing }}
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests-${{ inputs.target }}
          pattern: digests-${{ inputs.target }}-*
          merge-multiple: true

      - name: ${{ inputs.target }} - Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ inputs.package }}
          flavor: ${{ inputs.flavor }}
          tags: ${{ inputs.tags }}

      - name: ${{ inputs.target }} - Create manifest list and push
        if: ${{ inputs.image-missing }}
        working-directory: ${{ runner.temp }}/digests-${{ inputs.target }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ inputs.package }}@sha256:%s ' *)

      - name: ${{ inputs.target }} - Inspect image
        if: ${{ inputs.image-missing }}
        run: |
          docker buildx imagetools inspect ${{ inputs.package }}:${{ steps.meta.outputs.version }}

      - name: ${{ inputs.target }} - Push to cache with commit sha
        if: ${{ inputs.image-missing }}
        run: |
          docker pull ${{ inputs.package }}:${{ steps.meta.outputs.version }}
          docker tag ${{ inputs.package }}:${{ steps.meta.outputs.version }} ${{ env.REGISTRY_CACHE }}:${{ github.sha }}${{ inputs.suffix }}
          docker push ${{ env.REGISTRY_CACHE }}:${{ github.sha }}${{ inputs.suffix }}

      # already exists, so want to add tags to existing image
      - name: ${{ inputs.target }} - Add tags to existing image
        if: ${{ !inputs.image-missing }}
        run: |
          CACHED="${{ env.REGISTRY_CACHE }}:${{ github.sha }}${{ inputs.suffix }}"
          docker pull ${CACHED}
          echo "Pulled ${CACHED}"
          echo "TAGS are: ${{ steps.meta.outputs.tags }}"
          TAGS="${{ steps.meta.outputs.tags }}"
          echo "TAGS after assign in bash are: ${TAGS}"
          for t in ${TAGS}
          do
            echo "Tag is: $t"
            git tag "${CACHED}" "${t}"
            git push "${t}"
          done

      - name: Set outputs
        run: |
          echo "target=${{ inputs.target }}" >> $GITHUB_OUTPUT
          echo "package=${{ inputs.package }}" >> $GITHUB_OUTPUT
