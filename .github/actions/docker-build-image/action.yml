# requires docker setup elsewhere
name: docker-build-image
description: 'Build docker image for specific platform'

inputs:
  target:
    required: true
    type: string
  package-name:
    required: true
    type: string
  platform:
    required: true
    type: string
  registry:
    required: true
    type: string

env:
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

outputs:
  package:
    description: "Container package"
    value: ${{ steps.output.outputs.package }}

runs:
  using: "composite"
  steps:
    - name: Prepare environment
      shell: bash
      run: |
        platform=${{ inputs.platform }}
        platform_pair=${platform//\//}
        package=${{ inputs.registry }}/${GITHUB_REPOSITORY@L}/${{ inputs.package-name }}
        echo "REGISTRY_CACHE=${package%\/*}/cache:${platform_pair}" >> $GITHUB_ENV
        echo "PLATFORM_PAIR=${platform_pair}" >> $GITHUB_ENV
        echo "PACKAGE=${package}" >> $GITHUB_ENV

    - name: ${{ inputs.target }} - Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.PACKAGE }}

    - name: ${{ inputs.target }} - Build and push by digest
      id: build
      uses: docker/build-push-action@v7
      with:
        context: .
        file: .docker/Dockerfile
        target: ${{ inputs.target }}
        platforms: linux/${{ inputs.platform }}
        labels: ${{ steps.meta.outputs.labels }}
        tags: ${{ env.PACKAGE }}
        push: ${{ github.event_name != 'pull_request' }}
        outputs: type=image,push-by-digest=true,name-canonical=true,push=true
        cache-from: |
          type=registry,ref=${{ env.REGISTRY_CACHE }}
        cache-to: |
          type=registry,mode=max,ref=${{ env.REGISTRY_CACHE }}

    - name: ${{ inputs.target }} - Export digest
      shell: bash
      run: |
        mkdir -p ${{ runner.temp }}/digests-${{ inputs.target }}
        digest="${{ steps.build.outputs.digest }}"
        touch "${{ runner.temp }}/digests-${{ inputs.target }}/${digest#sha256:}"

    - name: ${{ inputs.target }} - Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: digests-${{ inputs.target }}-${{ env.PLATFORM_PAIR }}
        path: ${{ runner.temp }}/digests-${{ inputs.target }}/*
        if-no-files-found: error
        retention-days: 1

    - name: Set outputs
      id: output
      shell: bash
      run: |
        echo "package=${{ env.PACKAGE }}" >> $GITHUB_OUTPUT
